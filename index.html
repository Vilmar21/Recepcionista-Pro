    function openForgotPasswordModal() {
      const currentEmail = document.getElementById('authEmail')?.value?.trim() || '';
      state.forgotPasswordEmail = currentEmail;
      state.forgotPasswordLoading = false;
      state.forgotPasswordError = null;
      state.forgotPasswordSuccess = null;
      state.isForgotPasswordModalOpen = true;
      renderApp();
    }

    function closeForgotPasswordModal() {
      state.isForgotPasswordModalOpen = false;
      state.forgotPasswordError = null;
      state.forgotPasswordSuccess = null;
      renderApp();
    }

    async function handleForgotPasswordSubmit(e) {
      e.preventDefault();
      const inputEl = document.getElementById('forgotEmailInput');
      const email = inputEl ? inputEl.value.trim() : state.forgotPasswordEmail.trim();

      if (!email) {
        state.forgotPasswordError = 'Por favor ingresa un correo electrónico.';
        renderApp();
        return;
      }

      state.forgotPasswordEmail = email;
      state.forgotPasswordLoading = true;
      state.forgotPasswordError = null;
      state.forgotPasswordSuccess = null;
      renderApp();

      try {
        if (!supabaseClient) {
          throw new Error('El cliente de Supabase no se encuentra inicializado.');
        }

        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin
        });

        if (error) {
          throw error;
        }

        state.forgotPasswordSuccess = `Revisa tu casilla de correo en ${email} (incluida la carpeta de spam o promociones) para continuar con el restablecimiento de tu contraseña.`;
      } catch (err) {
        console.error('Error al solicitar reset de contraseña:', err);
        state.forgotPasswordError = err.message || 'Error al procesar la recuperación de contraseña.';
      } finally {
        state.forgotPasswordLoading = false;
        renderApp();
      }
    }

    // ==========================================
    // 15.2 MODAL OBLIGATORIO: "ESTABLECER NUEVA CONTRASEÑA"
    // ==========================================
    function renderResetPasswordModal() {
      const isHidden = !state.isPasswordRecoveryMode && !state.isResetPasswordModalOpen;

      return `
        <div id="reset-password-modal" class="${isHidden ? 'hidden' : 'fixed inset-0 z-90 flex items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md animate-in fade-in duration-200'}">
          <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full border border-slate-200 overflow-hidden flex flex-col">
            <div class="bg-slate-900 px-6 py-6 text-white text-center">
              <div class="w-14 h-14 rounded-2xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center mx-auto mb-3 text-blue-400">
                <i data-lucide="lock" class="w-7 h-7"></i>
              </div>
              <h3 class="font-extrabold text-lg text-white">Establecer Nueva Contraseña</h3>
              <p class="text-xs text-slate-300 mt-1 max-w-xs mx-auto">
                Para tu seguridad, debes definir una nueva contraseña antes de ingresar a la aplicación.
              </p>
            </div>

            <form onsubmit="handleUpdatePasswordSubmit(event)" class="p-6 sm:p-7 space-y-4 text-xs">
              ${state.resetPasswordError ? `
                <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-800 text-xs flex items-start gap-2">
                  <i data-lucide="alert-circle" class="w-4 h-4 text-rose-600 shrink-0 mt-0.5"></i>
                  <p class="leading-snug">${state.resetPasswordError}</p>
                </div>
              ` : ''}

              <div>
                <label class="block font-bold text-slate-700 mb-1.5">Nueva Contraseña *</label>
                <div class="relative">
                  <input 
                    type="password" 
                    id="newPasswordInput" 
                    required 
                    minlength="6"
                    placeholder="Mínimo 6 caracteres"
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
                <p class="text-[11px] text-slate-400 mt-1">Usa al menos 6 caracteres seguros.</p>
              </div>

              <div>
                <label class="block font-bold text-slate-700 mb-1.5">Confirmar Nueva Contraseña *</label>
                <div class="relative">
                  <input 
                    type="password" 
                    id="confirmPasswordInput" 
                    required 
                    minlength="6"
                    placeholder="Repite la contraseña"
                    class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>

              <button 
                type="submit" 
                id="submitNewPasswordBtn"
                ${state.resetPasswordLoading ? 'disabled' : ''}
                class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-60 disabled:cursor-not-allowed mt-2"
              >
                ${state.resetPasswordLoading ? `
                  <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                  <span>Actualizando contraseña...</span>
                ` : `
                  <span>Guardar Nueva Contraseña</span>
                  <i data-lucide="check" class="w-4 h-4"></i>
                `}
              </button>

              <div class="text-center pt-2">
                <button 
                  type="button" 
                  onclick="cancelPasswordRecoveryFlow()" 
                  class="text-xs text-slate-500 hover:text-slate-800 font-semibold cursor-pointer"
                >
                  Cancelar y volver al inicio de sesión
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    async function cancelPasswordRecoveryFlow() {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
      }
      state.isPasswordRecoveryMode = false;
      state.isResetPasswordModalOpen = false;
      state.user = null;
      state.resetPasswordError = null;
      window.location.hash = '';
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
      renderApp();
    }

    async function handleUpdatePasswordSubmit(e) {
      e.preventDefault();
      const passInput = document.getElementById('newPasswordInput');
      const confirmInput = document.getElementById('confirmPasswordInput');
      const newPasswordValue = passInput ? passInput.value : '';
      const confirmPasswordValue = confirmInput ? confirmInput.value : '';

      if (!newPasswordValue || newPasswordValue.length < 6) {
        state.resetPasswordError = 'La contraseña debe tener al menos 6 caracteres.';
        renderApp();
        return;
      }

      if (newPasswordValue !== confirmPasswordValue) {
        state.resetPasswordError = 'Las contraseñas no coinciden. Por favor verifícalas.';
        renderApp();
        return;
      }

      state.resetPasswordLoading = true;
      state.resetPasswordError = null;
      renderApp();

      try {
        if (!supabaseClient) throw new Error('Cliente Supabase no disponible.');

        const { data, error } = await supabaseClient.auth.updateUser({
          password: newPasswordValue
        });

        if (error) throw error;

        showToast('Contraseña actualizada correctamente', 'success');

        await supabaseClient.auth.signOut();

        state.isPasswordRecoveryMode = false;
        state.isResetPasswordModalOpen = false;
        state.user = null;
        state.authMode = 'login';
        state.authSuccessMessage = '¡Contraseña actualizada correctamente! Ingresá a continuación con tu nueva contraseña.';
        state.authErrorMessage = null;
        state.resetPasswordError = null;

        window.location.hash = '';
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, '', window.location.pathname);
        }

        renderApp();
      } catch (err) {
        console.error('Error al actualizar contraseña:', err);
        state.resetPasswordError = err.message || 'Error al actualizar contraseña.';
        renderApp();
      } finally {
        state.resetPasswordLoading = false;
        renderApp();
      }
    }

    // 15.3 LOGIN & SIGNUP (SUBMIT)
    async function handleAuthSubmit(e) {
      e.preventDefault();
      state.authErrorMessage = null;
      state.authSuccessMessage = null;

      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;

      if (!email || !password) {
        state.authErrorMessage = 'Por favor completa correo y contraseña.';
        renderApp();
        return;
      }

      state.authSubmitLoading = true;
      renderApp();

      try {
        if (!supabaseClient) {
          throw new Error('Supabase no está conectado. Revisa tu conexión a internet.');
        }

        if (state.authMode === 'signup') {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;

          if (data.session) {
            state.user = data.user;
            showToast('¡Bienvenido a Recepcionista Pro!', 'success');
          } else {
            state.authSuccessMessage = '¡Cuenta creada! Ya puedes iniciar sesión con tus credenciales.';
            state.authMode = 'login';
            showToast('Cuenta creada con éxito', 'success');
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) {
            if (error.message.includes('Invalid login credentials')) {
              throw new Error('Correo o contraseña incorrectos. Por favor verifica tus datos.');
            }
            throw error;
          }
          if (data.user) {
            state.user = data.user;
            showToast('Sesión iniciada correctamente', 'success');
          }
        }
      } catch (err) {
        state.authErrorMessage = err.message || 'Error al procesar la solicitud.';
      } finally {
        state.authSubmitLoading = false;
        renderApp();
        if (state.user && !state.isPasswordRecoveryMode) {
          await fetchServicesFromCloud();
          await fetchAppointmentsFromCloud();
        }
      }
    }

    // 15.4 LOGOUT
    function handleLogout() {
      openConfirmModal(
        'Cerrar Sesión',
        '¿Estás seguro de que deseas cerrar tu sesión actual?',
        async () => {
          if (supabaseClient) {
            await supabaseClient.auth.signOut();
          }
          state.user = null;
          state.appointments = [];
          state.clients = [];
          showToast('Sesión cerrada correctamente', 'info');
          renderApp();
        },
        'Cerrar Sesión',
        'primary'
      );
    }

    function setAuthMode(mode) {
      state.authMode = mode;
      state.authErrorMessage = null;
      state.authSuccessMessage = null;
      renderApp();
    }

    // ==========================================
    // 16. MODAL DE CONFIRMACIÓN GENÉRICO
    // ==========================================
    function renderConfirmModal() {
      if (!state.confirmModal.isOpen) return '';
      const cm = state.confirmModal;
      const isDanger = cm.confirmVariant === 'danger';

      return `
        <div class="fixed inset-0 z-80 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-xs">
          <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 text-center border border-slate-200 space-y-4 animate-in fade-in duration-150">
            <div class="w-12 h-12 rounded-2xl ${isDanger ? 'bg-rose-100 text-rose-600' : 'bg-blue-100 text-blue-600'} flex items-center justify-center mx-auto">
              <i data-lucide="${isDanger ? 'alert-triangle' : 'help-circle'}" class="w-6 h-6"></i>
            </div>
            <div>
              <h3 class="text-base font-black text-slate-900">${cm.title}</h3>
              <p class="text-xs text-slate-500 mt-1 leading-snug">${cm.message}</p>
            </div>
            <div class="flex items-center gap-2 pt-2">
              <button 
                onclick="closeConfirmModal()" 
                class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition-colors cursor-pointer"
              >
                Cancelar
              </button>
              <button 
                onclick="handleConfirmModalAction()" 
                class="flex-1 py-2.5 ${isDanger ? 'bg-rose-600 hover:bg-rose-500' : 'bg-blue-600 hover:bg-blue-500'} text-white font-bold rounded-xl text-xs shadow-md transition-colors cursor-pointer"
              >
                ${cm.confirmText}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 17. RENDERIZADO GENERAL Y CONTROLADORES
    // ==========================================
    function renderApp() {
      const appContainer = document.getElementById('app');
      if (!appContainer) return;

      if (state.isPasswordRecoveryMode) {
        appContainer.innerHTML = `
          <div class="min-h-screen bg-slate-900 flex items-center justify-center relative overflow-hidden">
            <div id="login-screen" class="hidden"></div>
            <div id="app-dashboard" class="hidden"></div>
            ${renderResetPasswordModal()}
          </div>
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      if (!state.user) {
        appContainer.innerHTML = `
          ${renderAuthScreen()}
          <div id="app-dashboard" class="hidden"></div>
          ${renderResetPasswordModal()}
        `;
        if (window.lucide) window.lucide.createIcons();
        return;
      }

      appContainer.innerHTML = `
        <div id="login-screen" class="hidden"></div>
        <div id="app-dashboard" class="min-h-screen bg-slate-100/70 text-slate-900 flex font-sans">
          <!-- BARRA LATERAL IZQUIERDA (DESKTOP) -->
          <aside class="hidden lg:block w-64 xl:w-72 shrink-0 h-screen sticky top-0 z-30 shadow-xl">
            ${renderLeftSidebar()}
          </aside>

          <!-- DRAWER MÓVIL / TABLET -->
          ${state.sidebarMobileOpen ? `
            <div class="fixed inset-0 z-50 lg:hidden flex">
              <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs" onclick="toggleMobileSidebar()"></div>
              <div class="relative w-72 max-w-[85vw] h-full z-10 shadow-2xl">
                ${renderLeftSidebar()}
              </div>
            </div>
          ` : ''}

          <!-- CONTENIDO PRINCIPAL (HEADER + ÁREA DE VISTA) -->
          <div class="flex-1 flex flex-col min-w-0 min-h-screen">
            <!-- ENCABEZADO SUPERIOR -->
            ${renderTopHeader()}

            <!-- Indicador de sincronización -->
            <div id="syncIndicator"></div>

            <!-- Banner Flotante de Alerta 10 minutos -->
            <div id="alertBannerContainer" class="fixed top-20 right-4 z-40 max-w-md w-full space-y-2 pointer-events-auto"></div>

            <!-- Área de la Vista Activa -->
            <main id="mainContentArea" class="flex-1 w-full max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-5 sm:py-6">
              <!-- Renderizado dinámico -->
            </main>
          </div>
        </div>

        <!-- Modales -->
        <div id="appointmentModalContainer">${renderAppointmentModal()}</div>
        <div id="manageServicesModalContainer">${renderManageServicesModal()}</div>
        <div id="alarmModalContainer">${renderAlarmModal()}</div>
        <div id="confirmModalContainer">${renderConfirmModal()}</div>
        ${renderResetPasswordModal()}
      `;

      renderMainView();
      renderAlertBanner();
      if (window.lucide) window.lucide.createIcons();
    }

    function renderSyncIndicator() {
      const el = document.getElementById('syncIndicator');
      if (!el) return;
      el.innerHTML = state.syncing ? `
        <div class="bg-blue-600 text-white text-[11px] font-semibold py-1 px-4 text-center flex items-center justify-center gap-1.5 shadow-xs">
          <span>Sincronizando con Supabase (tablas 'recepcion' y 'servicios')...</span>
        </div>
      ` : '';
    }

    function switchTab(tabId) {
      state.currentTab = tabId;
      state.sidebarMobileOpen = false;
      renderApp();
    }

    function applyFilter(filter) {
      state.statusFilter = filter;
      state.currentTab = 'appointments';
      state.sidebarMobileOpen = false;
      renderApp();
    }

    function handleSearch(q) {
      state.searchQuery = q;
      renderMainView();
    }

    function toggleMobileSidebar() {
      state.sidebarMobileOpen = !state.sidebarMobileOpen;
      renderApp();
    }

    function openAppointmentModal(appId = null, initialDate = null) {
      if (appId) {
        state.editingAppointment = state.appointments.find(a => a.id === appId) || null;
      } else {
        state.editingAppointment = initialDate ? {
          clientName: '',
          clientPhone: '',
          clientEmail: '',
          serviceName: state.services[0]?.name || 'Consulta Estándar',
          serviceId: state.services[0]?.id || 'srv-1',
          date: initialDate,
          startTime: '10:00',
          durationMinutes: 45,
          price: 15000,
          amountPaid: 0,
          paymentMethod: 'Efectivo',
          status: 'pendiente',
          notes: ''
        } : null;
      }
      state.isAppointmentModalOpen = true;
      renderApp();
    }

    function closeAppointmentModal() {
      state.isAppointmentModalOpen = false;
      state.editingAppointment = null;
      renderApp();
    }

    function openManageServicesModal() {
      state.editingServiceId = null;
      state.isManageServicesModalOpen = true;
      renderApp();
    }

    function closeManageServicesModal() {
      state.isManageServicesModalOpen = false;
      state.editingServiceId = null;
      renderApp();
    }

    function testAlarmChime() {
      playAlarmChime();
      showToast('Probando timbre de alarma de 5 minutos', 'info');
    }

    // ==========================================
    // 18. INICIALIZACIÓN DE LA APLICACIÓN & AUTH LISTENERS
    // ==========================================
    window.addEventListener('DOMContentLoaded', async () => {
      // Detección inicial de token de recuperación de contraseña en el hash de la URL
      if (window.location.hash && window.location.hash.includes('type=recovery')) {
        state.isPasswordRecoveryMode = true;
        state.isResetPasswordModalOpen = true;
      }

      if (supabaseClient) {
        // 1. AUTH STATE LISTENER FOR PASSWORD RECOVERY
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            state.isPasswordRecoveryMode = true;
            state.isResetPasswordModalOpen = true;
            state.authLoading = false;
            renderApp();

            const resetModal = document.getElementById('reset-password-modal');
            const loginScreen = document.getElementById('login-screen');
            const appDashboard = document.getElementById('app-dashboard');

            if (resetModal) resetModal.classList.remove('hidden');
            if (loginScreen) loginScreen.classList.add('hidden');
            if (appDashboard) appDashboard.classList.add('hidden');
            return;
          }

          if (state.isPasswordRecoveryMode) {
            return;
          }

          state.user = session?.user ?? null;
          state.authLoading = false;
          renderApp();

          if (state.user) {
            fetchServicesFromCloud();
            fetchAppointmentsFromCloud();
          }
        });

        // Obtener sesión inicial
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
          if (state.isPasswordRecoveryMode) {
            state.authLoading = false;
            renderApp();
            return;
          }

          state.user = session?.user ?? null;
          state.authLoading = false;
          renderApp();

          if (state.user) {
            fetchServicesFromCloud();
            fetchAppointmentsFromCloud();
          }
        });

        // Suscripción Realtime a tabla 'recepcion'
        supabaseClient
          .channel('realtime_recepcion_channel')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'recepcion' }, () => {
            if (!state.isPasswordRecoveryMode && state.user) {
              fetchAppointmentsFromCloud();
            }
          })
          .subscribe();

        // Suscripción Realtime a tabla 'servicios'
        supabaseClient
          .channel('realtime_servicios_channel')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'servicios' }, () => {
            if (!state.isPasswordRecoveryMode && state.user) {
              fetchServicesFromCloud();
            }
          })
          .subscribe();
      } else {
        state.authLoading = false;
        renderApp();
      }

      // Iniciar el temporizador de alerta cada 30 segundos
      startRealTimeAlarmTimer();
    });
  </script>
</body>
</html>
