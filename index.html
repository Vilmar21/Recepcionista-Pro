  <!-- Aislamiento de errores de extensiones del navegador (ej. MetaMask / Web3 / extensiones ajenas) -->
  <script>
    (function() {
      window.addEventListener('error', function(event) {
        var fn = event.filename || '';
        var msg = event.message || '';
        if (fn.indexOf('chrome-extension://') !== -1 || fn.indexOf('moz-extension://') !== -1 ||
            msg.indexOf('MetaMask') !== -1 || msg.indexOf('ethereum') !== -1 || msg.indexOf('Failed to connect') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (msg.indexOf('chrome-extension://') !== -1 || msg.indexOf('moz-extension://') !== -1 ||
            msg.indexOf('MetaMask') !== -1 || msg.indexOf('ethereum') !== -1) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    })();
  </script>

    // ==========================================
    // 3. UTILIDADES DE FECHA, CALENDARIO SEMANAL Y NOTIFICACIONES
    // ==========================================
    const MONTH_NAMES_ES = [
      'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
      'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
    ];

    const DAY_NAMES_ES = [
      { short: 'Lun', full: 'Lunes' },
      { short: 'Mar', full: 'Martes' },
      { short: 'Mié', full: 'Miércoles' },
      { short: 'Jue', full: 'Jueves' },
      { short: 'Vie', full: 'Viernes' },
      { short: 'Sáb', full: 'Sábado' },
      { short: 'Dom', full: 'Domingo' }
    ];

    function getTodayString() {
      const now = new Date();
      const yr = now.getFullYear();
      const mo = String(now.getMonth() + 1).padStart(2, '0');
      const da = String(now.getDate()).padStart(2, '0');
      return `${yr}-${mo}-${da}`;
    }

    // Calcula el Lunes de la semana para cualquier fecha dada
    function getMondayOfDate(d) {
      const date = new Date(d);
      const day = date.getDay(); // 0 es Domingo, 1 es Lunes...
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(date.setDate(diff));
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    // Genera el conjunto de 7 días de la semana (Lunes a Domingo) según el weekOffset
    function getWeekInfo(offset = 0) {
      const now = new Date();
      const baseMonday = getMondayOfDate(now);
      baseMonday.setDate(baseMonday.getDate() + (offset * 7));

      const days = [];
      for (let i = 0; i < 7; i++) {
        const dayDate = new Date(baseMonday);
        dayDate.setDate(baseMonday.getDate() + i);

        const yr = dayDate.getFullYear();
        const mo = String(dayDate.getMonth() + 1).padStart(2, '0');
        const da = String(dayDate.getDate()).padStart(2, '0');
        const dateStr = `${yr}-${mo}-${da}`;

        days.push({
          dateStr,
          dayNumber: dayDate.getDate(),
          monthNumber: dayDate.getMonth() + 1,
          monthName: MONTH_NAMES_ES[dayDate.getMonth()],
          year: dayDate.getFullYear(),
          name: DAY_NAMES_ES[i].full,
          shortName: DAY_NAMES_ES[i].short,
          isToday: dateStr === getTodayString()
        });
      }

      const startDay = days[0];
      const endDay = days[6];
      let rangeLabel = '';
      if (startDay.monthNumber === endDay.monthNumber) {
        rangeLabel = `${startDay.dayNumber} al ${endDay.dayNumber} de ${startDay.monthName} ${startDay.year}`;
      } else if (startDay.year === endDay.year) {
        rangeLabel = `${startDay.dayNumber} ${startDay.monthName.slice(0, 3)} - ${endDay.dayNumber} ${endDay.monthName.slice(0, 3)} ${startDay.year}`;
      } else {
        rangeLabel = `${startDay.dayNumber} ${startDay.monthName.slice(0, 3)} ${startDay.year} - ${endDay.dayNumber} ${endDay.monthName.slice(0, 3)} ${endDay.year}`;
      }

      return {
        days,
        rangeLabel,
        isCurrentWeek: offset === 0,
        startDate: startDay.dateStr,
        endDate: endDay.dateStr
      };
    }

    function changeWeek(delta) {
      state.weekOffset += delta;
      renderApp();
    }

    function goToCurrentWeek() {
      state.weekOffset = 0;
      renderApp();
    }

    function formatCurrencyARS(amount) {
      const num = Number(amount) || 0;
      return '$ ' + num.toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function timeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    function addMinutesToTime(timeStr, minutes) {
      const total = timeToMinutes(timeStr) + Number(minutes || 0);
      const h = Math.floor(total / 60) % 24;
      const m = total % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function normalizeArgentinePhone(rawPhone) {
      if (!rawPhone) return '';
      let digits = rawPhone.replace(/\D/g, '');
      if (digits.startsWith('0054')) digits = digits.slice(4);
      else if (digits.startsWith('054')) digits = digits.slice(3);
      if (digits.startsWith('54')) digits = digits.slice(2);
      if (digits.startsWith('9')) digits = digits.slice(1);
      if (digits.startsWith('0')) digits = digits.slice(1);
      if (digits.startsWith('1115') && digits.length >= 10) digits = '11' + digits.slice(4);
      else if (digits.startsWith('15') && digits.length === 10) digits = '11' + digits.slice(2);
      return `549${digits}`;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;

      const toast = document.createElement('div');
      const bg = type === 'success' ? 'bg-emerald-600 text-white' :
                 type === 'error' ? 'bg-rose-600 text-white' :
                 type === 'warning' ? 'bg-amber-600 text-white' :
                 'bg-slate-900 text-white';

      const iconName = type === 'success' ? 'check-circle-2' :
                       type === 'error' ? 'alert-circle' :
                       type === 'warning' ? 'alert-triangle' : 'info';

      toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl text-xs font-semibold ${bg} transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto border border-white/20`;
      toast.innerHTML = `
        <i data-lucide="${iconName}" class="w-4 h-4 shrink-0"></i>
        <span>${message}</span>
      `;

      container.appendChild(toast);
      if (window.lucide) window.lucide.createIcons();

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function openConfirmModal(title, message, onConfirm, confirmText = 'Eliminar', confirmVariant = 'danger') {

        isOpen: true,

    function closeConfirmModal() {
      state.confirmModal.isOpen = false;
      state.confirmModal.onConfirm = null;

    // ==========================================
    // 4. WEB AUDIO API (ALERTAS SONORAS)
    // ==========================================
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playAlertBeep() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const beeps = [
          { freq: 880, start: 0, duration: 0.12 },
          { freq: 1046.5, start: 0.16, duration: 0.20 }
        ];
        beeps.forEach(({ freq, start, duration }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + start);
          gain.gain.setValueAtTime(0.001, now + start);
          gain.gain.exponentialRampToValueAtTime(0.25, now + start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + start);
          osc.stop(now + start + duration + 0.04);
        });
      } catch (e) {
        console.warn('AudioContext beep error:', e);
      }
    }

    function playAlarmChime() {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const notes = [
          { freq: 587.33, start: 0, duration: 0.16 },
          { freq: 783.99, start: 0.18, duration: 0.18 },
          { freq: 1046.50, start: 0.38, duration: 0.32 },
          { freq: 783.99, start: 0.80, duration: 0.16 },
          { freq: 1046.50, start: 1.00, duration: 0.38 },
        ];
        notes.forEach(({ freq, start, duration }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + start);
          gain.gain.setValueAtTime(0.001, now + start);
          gain.gain.exponentialRampToValueAtTime(0.3, now + start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + start);
          osc.stop(now + start + duration + 0.05);
        });
      } catch (e) {
        console.warn('AudioContext chime error:', e);
      }
    }

    // ==========================================
    // 5. MAPEO Y CRUD EN TABLAS SUPABASE ('recepcion' y 'servicios')
    // ==========================================
    function mapRowToAppointment(row) {
      let parsed = {};
      if (row.notas) {
        try {
          parsed = JSON.parse(row.notas);
        } catch {
          parsed = { notes: row.notas };
        }
      }
      const dateStr = parsed.date || (row.created_at ? row.created_at.slice(0, 10) : getTodayString());
      return {
        id: row.id ? String(row.id) : (parsed.id || `app-${Date.now()}`),
        numericId: row.id || null,
        clientId: parsed.clientId || `cli-${row.id || Date.now()}`,
        clientName: parsed.clientName || row.empresa || 'Cliente',
        clientPhone: parsed.clientPhone || '',
        clientEmail: parsed.clientEmail || '',
        serviceId: parsed.serviceId || 'srv-1',
        serviceName: parsed.serviceName || row.motivo || 'Servicio General',
        date: dateStr,
        startTime: parsed.startTime || '10:00',
        endTime: parsed.endTime || '10:45',
        durationMinutes: Number(parsed.durationMinutes) || 45,
        price: Number(parsed.price) || 0,
        deposit: Number(parsed.deposit) || 0,
        amountPaid: Number(parsed.amountPaid) || 0,
        paymentMethod: parsed.paymentMethod || 'Efectivo',
        status: row.estado || parsed.status || 'pendiente',
        notes: parsed.notes || '',
        createdAt: row.created_at || new Date().toISOString()
      };
    }

    function mapAppointmentToRow(app, userId) {
      const payloadJson = JSON.stringify({
        clientName: app.clientName,
        clientPhone: app.clientPhone,
        clientEmail: app.clientEmail,
        clientId: app.clientId,
        serviceId: app.serviceId,
        serviceName: app.serviceName,
        date: app.date,
        startTime: app.startTime,
        endTime: app.endTime,
        durationMinutes: app.durationMinutes,
        price: app.price,
        deposit: app.deposit,
        amountPaid: app.amountPaid,
        paymentMethod: app.paymentMethod,
        status: app.status,
        notes: app.notes,
        updatedAt: new Date().toISOString()
      });

      return {
        user_id: userId,
        empresa: app.clientName,
        motivo: `${app.serviceName} - ${app.date} ${app.startTime}hs`,
        estado: app.status,
        notas: payloadJson
      };
    }

    // 5.1 READ: Turnos desde 'recepcion'
    async function fetchAppointmentsFromCloud() {
      if (!supabaseClient || !state.user || state.isPasswordRecoveryMode) return;
      state.syncing = true;
      renderSyncIndicator();

      try {
        const { data, error } = await supabaseClient
          .from('recepcion')
          .select('*')
          .order('id', { ascending: false });

        if (error) {
          console.error('Error fetching recepcion:', error);
          showToast('Aviso de conexión: ' + error.message, 'warning');
        } else if (data) {
          state.appointments = data.map(mapRowToAppointment);
          rebuildClientsFromAppointments();
        }
      } catch (err) {
        console.error('Failed to load appointments:', err);
      } finally {
        state.syncing = false;
        renderSyncIndicator();
        renderMainView();
      }
    }

    // 5.2 READ: Servicios desde 'servicios'
    async function fetchServicesFromCloud() {
      if (!supabaseClient || !state.user || state.isPasswordRecoveryMode) return;
      try {
        const { data, error } = await supabaseClient
          .from('servicios')
          .select('*')
          .order('id', { ascending: false });

        if (error) {
          console.warn('Tabla servicios o RLS no disponible, usando servicios locales:', error.message);
          if (state.services.length === 0) {
            state.services = [...DEFAULT_SERVICES];
          }
        } else if (data && data.length > 0) {
          state.services = data.map(s => ({
            id: String(s.id),
            name: s.nombre || s.name || 'Servicio',
            durationMinutes: Number(s.duracion_minutos || s.duracion || s.durationMinutes || 45),
            price: Number(s.precio || s.price || 0),
            category: s.categoria || s.category || 'Servicios'
          }));
        } else {
          if (state.services.length === 0) {
            state.services = [...DEFAULT_SERVICES];
          }
        }
      } catch (err) {
        console.error('Error al consultar servicios:', err);
        if (state.services.length === 0) {
          state.services = [...DEFAULT_SERVICES];
        }
      }
    }

    function rebuildClientsFromAppointments() {
      const map = new Map();
      for (const app of state.appointments) {
        if (!app.clientName) continue;
        const key = app.clientPhone || app.clientName;
        if (!map.has(key)) {
          map.set(key, {
            id: app.clientId,
            name: app.clientName,
            phone: app.clientPhone,
            email: app.clientEmail,
            totalVisits: 1,
            totalSpent: app.amountPaid || 0,
            lastVisit: app.date
          });
        } else {
          const cur = map.get(key);
          cur.totalVisits++;
          cur.totalSpent += app.amountPaid || 0;
          if (app.date > cur.lastVisit) cur.lastVisit = app.date;
        }
      }
      state.clients = Array.from(map.values());
    }

    // 5.3 CREATE & UPDATE: Guardar / Actualizar Turno en 'recepcion'
    async function saveAppointment(appointmentData) {
      if (!supabaseClient || !state.user) return;

      const isExisting = Boolean(appointmentData.numericId || (appointmentData.id && !String(appointmentData.id).startsWith('app-')));
      const targetId = appointmentData.numericId || appointmentData.id;
      const rowPayload = mapAppointmentToRow(appointmentData, state.user.id);

      try {
        if (isExisting) {
          // UPDATE (.update())
          const { error } = await supabaseClient
            .from('recepcion')
            .update(rowPayload)
            .eq('id', targetId);

          if (error) {
            showToast('Error al actualizar turno: ' + error.message, 'error');
            return;
          }
          showToast('Turno actualizado correctamente en Supabase', 'success');
        } else {
          // CREATE (INSERT)
          const { data, error } = await supabaseClient
            .from('recepcion')
            .insert([rowPayload])
            .select()
            .single();

          if (error) {
            showToast('Error al crear turno: ' + error.message, 'error');
            return;

    // 5.5 UPDATE RÁPIDO DE ESTADO: (.update())
    async function changeAppointmentStatus(appId, newStatus) {
      const app = state.appointments.find(a => a.id === appId);
      if (!app) return;

      const oldStatus = app.status;
      app.status = newStatus;
      renderApp();

      const targetId = app.numericId || (!String(app.id).startsWith('app-') ? app.id : null);

            .eq('id', targetId);

          if (error) {
            app.status = oldStatus;
            showToast('Error al actualizar estado: ' + error.message, 'error');
            renderApp();
            return;
          }
          showToast(`Estado actualizado a "${newStatus}"`, 'success');

    // 5.6 CRUD SERVICIOS: CREATE (INSERT)
    async function createServiceInCloud(name, duration, price, category) {
      const newService = {
        id: `srv-${Date.now()}`,
        name: name.trim(),
        durationMinutes: Number(duration) || 30,
        price: Number(price) || 0,
        category: (category || 'Servicios').trim()
      };

      if (supabaseClient && state.user) {
        try {
          const { data, error } = await supabaseClient
            .from('servicios')
            .insert([{
              nombre: newService.name,
              duracion_minutos: newService.durationMinutes,
              precio: newService.price,
              categoria: newService.category,
              user_id: state.user.id
            }])
            .select()
            .single();

          if (error) {
            console.warn('Error al insertar en tabla servicios de Supabase:', error.message);
            showToast('Servicio guardado localmente (aviso Supabase: ' + error.message + ')', 'warning');
          } else if (data) {
            newService.id = String(data.id);
            showToast('Servicio creado con éxito en Supabase', 'success');
          }
        } catch (e) {
          console.warn('Inserción en tabla servicios:', e);
        }
      }

      state.services.unshift(newService);
      return newService;

    // 5.7 CRUD SERVICIOS: UPDATE (.update())
    async function updateServiceInCloud(serviceId, name, duration, price, category) {
      const updatedData = {
        name: name.trim(),
        durationMinutes: Number(duration) || 30,
        price: Number(price) || 0,
        category: (category || 'Servicios').trim()
      };

      const targetId = Number(serviceId) || serviceId;
      if (supabaseClient && !String(serviceId).startsWith('srv-')) {
        try {
          const { error } = await supabaseClient
            .from('servicios')
            .update({
              nombre: updatedData.name,
              duracion_minutos: updatedData.durationMinutes,
              precio: updatedData.price,
              categoria: updatedData.category
            })
            .eq('id', targetId);

          if (error) {
            showToast('Error al actualizar servicio en Supabase: ' + error.message, 'error');
          } else {
            showToast('Servicio actualizado en Supabase', 'success');
          }
        } catch (e) {
          console.warn('Error al actualizar servicio:', e);
        }
      } else {
        showToast('Servicio actualizado', 'success');

        s.category = updatedData.category;

    // ==========================================
    // 6. TEMPORIZADOR DE ALARMA DE 10 MINUTOS
    // ==========================================
    function startRealTimeAlarmTimer() {
      setInterval(() => {
        if (!state.user || state.appointments.length === 0 || state.isPasswordRecoveryMode) return;

        const now = new Date();
        const today = getTodayString();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const matchedAlerts = [];

        for (const app of state.appointments) {
          if (app.date !== today) continue;
          if (app.status === 'cancelado' || app.status === 'completado') continue;

          const appMinutes = timeToMinutes(app.startTime);
          const diff = appMinutes - currentMinutes;

          if (diff >= 0 && diff <= 10) {
            matchedAlerts.push({ appointment: app, minutesLeft: diff });

            if (!state.alertedBeepIds.has(app.id)) {
              playAlertBeep();
              state.alertedBeepIds.add(app.id);
            }
          }

          if (diff <= 5 && diff >= 0 && !state.alarmTriggeredIds.has(app.id)) {
            state.alarmTriggeredIds.add(app.id);
            state.alarmAppointment = app;
            state.isAlarmModalOpen = true;
            playAlarmChime();
            renderApp();
          }
        }

        state.upcomingAlerts = matchedAlerts;
        renderAlertBanner();
      }, 30000);
    }

    // ==========================================
    // 7. EXPORTACIÓN A EXCEL (.xlsx) CON EXCELJS (ESTILOS, COLORES Y TOTALES)
    // ==========================================
    async function exportAppointmentsToExcel() {
      if (state.appointments.length === 0) {
        showToast('No hay turnos registrados para exportar.', 'warning');
        return;
      }

      // Si ExcelJS no estuviera disponible, usar fallback de SheetJS
      if (!window.ExcelJS) {
        if (window.XLSX) {
          exportAppointmentsWithSheetJS();
          return;
        }
        showToast('El módulo de exportación se está cargando. Por favor reintenta en unos instantes.', 'warning');
        return;
      }

      showToast('Generando planilla Excel profesional con estilos...', 'info');

      try {
        const workbook = new window.ExcelJS.Workbook();
        workbook.creator = 'Recepcionista Pro';
        workbook.lastModifiedBy = state.settings.businessName || 'Recepcionista Pro';
        workbook.created = new Date();
        workbook.modified = new Date();

        const worksheet = workbook.addWorksheet('Turnos y Recepción', {
          views: [{ showGridLines: true }]
        });

        // 1. Columnas y encabezados
        worksheet.columns = [
          { header: 'Fecha', key: 'fecha', width: 14 },
          { header: 'Hora', key: 'hora', width: 12 },
          { header: 'Cliente / Paciente', key: 'cliente', width: 28 },
          { header: 'Teléfono (WhatsApp)', key: 'telefono', width: 20 },
          { header: 'Email', key: 'email', width: 26 },
          { header: 'Servicio Solicitado', key: 'servicio', width: 26 },
          { header: 'Precio Total ($)', key: 'precio', width: 18 },
          { header: 'Seña ($)', key: 'sena', width: 16 },
          { header: 'Total Cobrado ($)', key: 'cobrado', width: 18 },
          { header: 'Saldo Pendiente ($)', key: 'saldo', width: 18 },
          { header: 'Medio de Pago', key: 'medioPago', width: 18 },
          { header: 'Estado', key: 'estado', width: 16 },
          { header: 'Notas / Observaciones', key: 'notas', width: 32 }
        ];

        // 2. Fila de Encabezado: Azul Marino Oscuro (#1E293B) con texto blanco en negrita
        const headerRow = worksheet.getRow(1);
        headerRow.height = 30;
        headerRow.eachCell((cell) => {
          cell.fill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FF1E293B' } // Navy Blue #1E293B
          };
          cell.font = {
            name: 'Segoe UI',
            size: 11,
            bold: true,
            color: { argb: 'FFFFFFFF' } // Blanco
          };
          cell.alignment = {
            vertical: 'middle',
            horizontal: 'center',
            wrapText: false
          };
          cell.border = {
            top: { style: 'thin', color: { argb: 'FFE2E8F0' } },
            left: { style: 'thin', color: { argb: 'FFE2E8F0' } },
            bottom: { style: 'medium', color: { argb: 'FF0F172A' } },
            right: { style: 'thin', color: { argb: 'FFE2E8F0' } }
          };
        });

        const thinBorder = {
          top: { style: 'thin', color: { argb: 'FFE2E8F0' } },
          left: { style: 'thin', color: { argb: 'FFE2E8F0' } },
          bottom: { style: 'thin', color: { argb: 'FFE2E8F0' } },
          right: { style: 'thin', color: { argb: 'FFE2E8F0' } }
        };

        let totalPrecio = 0;
        let totalSena = 0;
        let totalCobrado = 0;
        let totalSaldo = 0;

        // 3. Filas de datos con Zebra Striping, formatos contables y badges de estado
        state.appointments.forEach((app, index) => {
          const priceVal = Number(app.price) || 0;
          const depositVal = Number(app.deposit) || 0;
          const paidVal = Number(app.amountPaid) || depositVal;
          const balanceVal = Math.max(0, priceVal - paidVal);

          totalPrecio += priceVal;
          totalSena += depositVal;
          totalCobrado += paidVal;
          totalSaldo += balanceVal;

          const rawStatus = (app.status || 'pendiente').toLowerCase().trim();
          const displayStatus = rawStatus.charAt(0).toUpperCase() + rawStatus.slice(1);

          const row = worksheet.addRow({
            fecha: app.date || '',
            hora: app.startTime ? `${app.startTime} hs` : '',
            cliente: app.clientName || 'Sin especificar',
            telefono: app.clientPhone || '',
            email: app.clientEmail || '',
            servicio: app.serviceName || '',
            precio: priceVal,
            sena: depositVal,
            cobrado: paidVal,
            saldo: balanceVal,
            medioPago: app.paymentMethod || 'Efectivo',
            estado: displayStatus,
            notas: app.notes || ''
          });

          row.height = 22;
          const isEvenRow = index % 2 === 1; // Alternancia para zebra striping

          row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
            cell.border = thinBorder;
            cell.font = { name: 'Segoe UI', size: 10, color: { argb: 'FF1E293B' } };

            // Zebra Striping suave (#F8FAFC en filas alternadas)
            if (isEvenRow) {
              cell.fill = {
                type: 'pattern',
                pattern: 'solid',
                fgColor: { argb: 'FFF8FAFC' } // Soft light blue/gray #F8FAFC
              };
            } else {
              cell.fill = {
                type: 'pattern',
                pattern: 'solid',
                fgColor: { argb: 'FFFFFFFF' }
              };
            }

            // Formatos específicos según columna
            if (colNumber === 1 || colNumber === 2) {
              // Fechas y Horas centradas
              cell.alignment = { vertical: 'middle', horizontal: 'center' };
            } else if (colNumber === 3 || colNumber === 5 || colNumber === 6 || colNumber === 13) {
              // Texto general a la izquierda
              cell.alignment = { vertical: 'middle', horizontal: 'left' };
            } else if (colNumber === 4 || colNumber === 11) {
              // Teléfono y Medio de pago centrados
              cell.alignment = { vertical: 'middle', horizontal: 'center' };
            } else if (colNumber >= 7 && colNumber <= 10) {
              // Valores Monetarios ($#,##0.00) alineados a la derecha
              cell.numFmt = '"$"#,##0.00';
              cell.alignment = { vertical: 'middle', horizontal: 'right' };
            } else if (colNumber === 12) {
              // Columna Estado con badges y colores condicionales
              cell.alignment = { vertical: 'middle', horizontal: 'center' };
              let badgeFill = 'FFF1F5F9';
              let badgeText = 'FF475569';

              if (rawStatus === 'pendiente') {
                badgeFill = 'FFFEF08A'; // Soft Yellow #FEF08A
                badgeText = 'FF854D0E';
              } else if (rawStatus === 'confirmado') {
                badgeFill = 'FFBFDBFE'; // Soft Blue #BFDBFE
                badgeText = 'FF1E40AF';
              } else if (rawStatus === 'completado') {
                badgeFill = 'FFBBF7D0'; // Soft Green #BBF7D0
                badgeText = 'FF166534';
              } else if (rawStatus === 'cancelado' || rawStatus === 'ausente') {
                badgeFill = 'FFFECACA'; // Soft Red #FECACA
                badgeText = 'FF991B1B';
              }

              cell.fill = {
                type: 'pattern',
                pattern: 'solid',
                fgColor: { argb: badgeFill }
              };
              cell.font = {
                name: 'Segoe UI',
                size: 10,
                bold: true,
                color: { argb: badgeText }
              };
            }
          });
        });

        // 4. Fila de Totales al final con texto en negrita, borde superior simple y doble borde inferior
        const totalsRow = worksheet.addRow({
          fecha: 'TOTALES',
          hora: `${state.appointments.length} turnos`,
          cliente: '',
          telefono: '',
          email: '',
          servicio: '',
          precio: totalPrecio,
          sena: totalSena,
          cobrado: totalCobrado,
          saldo: totalSaldo,
          medioPago: '',
          estado: '',
          notas: ''
        });

        totalsRow.height = 26;
        const totalsBorder = {
          top: { style: 'thin', color: { argb: 'FF64748B' } },
          bottom: { style: 'double', color: { argb: 'FF1E293B' } }, // Doble borde inferior
          left: { style: 'thin', color: { argb: 'FFE2E8F0' } },
          right: { style: 'thin', color: { argb: 'FFE2E8F0' } }
        };

        totalsRow.eachCell({ includeEmpty: true }, (cell, colNumber) => {
          cell.border = totalsBorder;
          cell.fill = {
            type: 'pattern',
            pattern: 'solid',
            fgColor: { argb: 'FFF1F5F9' } // Resalte en gris suave
          };
          cell.font = {
            name: 'Segoe UI',
            size: 11,
            bold: true,
            color: { argb: 'FF0F172A' }
          };

          if (colNumber === 1 || colNumber === 2) {
            cell.alignment = { vertical: 'middle', horizontal: 'center' };
          } else if (colNumber >= 7 && colNumber <= 10) {
            cell.numFmt = '"$"#,##0.00';
            cell.alignment = { vertical: 'middle', horizontal: 'right' };
          } else {
            cell.alignment = { vertical: 'middle', horizontal: 'left' };
          }
        });

        // 5. Auto-ajuste dinámico del ancho de columnas para evitar recortes
        worksheet.columns.forEach((column) => {
          let maxLen = column.header ? column.header.length : 12;
          column.eachCell({ includeEmpty: true }, (cell) => {
            let val = cell.value;
            if (val !== null && val !== undefined) {
              let str = '';
              if (typeof val === 'number') {
                str = '$' + val.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
              } else if (typeof val === 'object' && val.text) {
                str = val.text;
              } else {
                str = String(val);
              }
              if (str.length > maxLen) {
                maxLen = str.length;
              }
            }
          });
          column.width = Math.max(maxLen + 4, 13);
        });

        // 6. Generación del buffer y descarga directa en el navegador
        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        });
        const todayStr = getTodayString();
        const fileName = `Recepcionista_Pro_${todayStr}.xlsx`;

        const downloadUrl = window.URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(downloadUrl);

        showToast('Planilla Excel con diseño profesional (.xlsx) descargada con éxito', 'success');
      } catch (err) {
        console.error('Error al generar Excel con ExcelJS:', err);
        exportAppointmentsWithSheetJS();
      }
    }

    // Respaldo de exportación con SheetJS
    function exportAppointmentsWithSheetJS() {
      if (!window.XLSX) {
        showToast('No fue posible exportar. Por favor revisa tu conexión a internet.', 'warning');
        return;
      }
      const rows = state.appointments.map(app => {
        const balance = Math.max(0, app.price - (app.amountPaid || app.deposit || 0));
        return {
          'Fecha': app.date,
          'Hora': app.startTime,
          'Visitante / Cliente': app.clientName || 'Sin especificar',
          'Teléfono (WhatsApp)': app.clientPhone || '',
          'Email': app.clientEmail || '',
          'Servicio Solicitado': app.serviceName || '',
          'Precio Total ($ ARS)': app.price,
          'Seña ($ ARS)': app.deposit || 0,
          'Total Cobrado ($ ARS)': app.amountPaid || 0,
          'Saldo Pendiente ($ ARS)': balance,
          'Medio de Pago': app.paymentMethod || 'Efectivo',
          'Estado': app.status,
          'Notas / Observaciones': app.notes || ''
        };
      });

      const worksheet = XLSX.utils.json_to_sheet(rows);
      worksheet['!cols'] = [
        { wch: 14 }, { wch: 12 }, { wch: 26 }, { wch: 20 },
        { wch: 24 }, { wch: 26 }, { wch: 18 }, { wch: 16 },
        { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 16 }, { wch: 32 }
      ];
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, 'Turnos');
      const todayStr = getTodayString();
      XLSX.writeFile(workbook, `Recepcionista_Pro_${todayStr}.xlsx`);
      showToast('Archivo Excel descargado con éxito', 'success');
    }

            </div>

            <!-- 5. Botón "Cerrar Sesión" (Logout) -->
            <button 
              onclick="handleLogout()"
              class="flex items-center gap-1.5 px-2.5 sm:px-3 py-2 text-xs font-semibold text-rose-700 hover:text-rose-800 bg-rose-50 hover:bg-rose-100 border border-rose-200/80 rounded-xl transition-colors cursor-pointer shrink-0"
              title="Cerrar sesión de Supabase"
            >
              <i data-lucide="log-out" class="w-4 h-4"></i>
              <span class="hidden sm:inline">Cerrar Sesión</span>
            </button>
          </div>
        </header>
      `;
    }

    // ==========================================
    // 9. BARRA LATERAL IZQUIERDA (LEFT SIDEBAR)
    // ==========================================

      const todayCount = state.appointments.filter(a => a.date === todayStr && a.status !== 'cancelado').length;

      const confirmedCount = state.appointments.filter(a => a.status === 'confirmado').length;
      const cancelledCount = state.appointments.filter(a => a.status === 'cancelado').length;

      const navItems = [
        { id: 'dashboard', label: 'Inicio / Panel', icon: 'layout-dashboard' },
        { id: 'calendar', label: 'Agenda Semanal', icon: 'calendar', badge: todayCount > 0 ? `${todayCount} hoy` : null },
        { id: 'appointments', label: 'Lista de Turnos', icon: 'list-filter', badge: state.appointments.length },
        { id: 'clients', label: 'Clientes', icon: 'users', badge: state.clients.length },
        { id: 'services', label: 'Servicios', icon: 'briefcase', badge: state.services.length },
        { id: 'settings', label: 'Configuración', icon: 'settings' }

      const navHtml = navItems.map(item => {
        const isActive = state.currentTab === item.id;

              <span class="truncate">${item.label}</span>
            </div>
            ${item.badge !== null && item.badge !== undefined ? `
              <span class="text-[10px] font-bold px-1.5 py-0.5 rounded-full ${

            <div class="flex items-center justify-between gap-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-slate-800 p-1 border border-slate-700 shadow-md flex items-center justify-center overflow-hidden shrink-0">
                  <img src="https://i.postimg.cc/Yq5ZGfpz/Gemini-Generated-Image-9wbbqy9wbbqy9wbb-modified.png" alt="Logo" class="w-full h-full object-contain">
                </div>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5">
                    <span class="font-extrabold text-sm tracking-tight text-white">Recepcionista Pro</span>
                    <span class="text-[9px] uppercase font-bold tracking-wider text-blue-400 bg-blue-950/80 px-1.5 py-0.2 rounded border border-blue-800/80">ARG</span>
                  </div>
                  <p class="text-xs text-slate-400 truncate max-w-[160px]">${state.settings.businessName}</p>

              <!-- Cerrar en móvil -->
              <button onclick="toggleMobileSidebar()" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
                <i data-lucide="x" class="w-5 h-5"></i>

          <!-- Navegación & Filtros -->
          <div class="flex-1 overflow-y-auto px-3 py-4 space-y-6">
            <!-- Menú Principal -->
            <div class="space-y-1">
              <div class="px-3 pb-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">

            <!-- Filtros Rápidos de la Barra Lateral -->

              <button onclick="applyFilter('today')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs text-slate-300 hover:text-white hover:bg-slate-800/60 transition-colors text-left cursor-pointer ${state.statusFilter === 'today' ? 'bg-blue-900/50 text-blue-300 font-bold' : ''}">

    // ==========================================
    // 10. COMPONENTE: CALENDARIO SEMANAL INTERACTIVO (WEEKLY CALENDAR GRID)
    // ==========================================
    function renderWeeklyCalendarGrid(containerTitle = 'Calendario Semanal de Turnos') {
      const weekInfo = getWeekInfo(state.weekOffset);
      const { days, rangeLabel, isCurrentWeek, startDate, endDate } = weekInfo;

      // Filtrar turnos dentro del rango de la semana actual visualizada
      const weekAppointments = state.appointments.filter(a => a.date >= startDate && a.date <= endDate);

      return `
        <div class="bg-white rounded-3xl border border-slate-200/90 shadow-sm overflow-hidden flex flex-col transition-all">
          <!-- CABECERA DEL CALENDARIO: TÍTULO, RANGO Y CONTROLES DE NAVEGACIÓN -->
          <div class="p-4 sm:p-5 border-b border-slate-200/80 flex flex-col md:flex-row md:items-center justify-between gap-3 bg-gradient-to-r from-slate-50 via-white to-slate-50/50">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-2xl bg-blue-600/10 border border-blue-200 text-blue-600 flex items-center justify-center shrink-0">
                <i data-lucide="calendar" class="w-5 h-5"></i>
              </div>
              <div>
                <div class="flex items-center gap-2 flex-wrap">
                  <h3 class="font-bold text-base sm:text-lg text-slate-900 tracking-tight">${containerTitle}</h3>
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${isCurrentWeek ? 'bg-blue-100 text-blue-800 border border-blue-200' : 'bg-slate-200 text-slate-700'}">
                    ${isCurrentWeek ? 'Semana Actual' : 'Semana'}
                  </span>
                </div>
                <p class="text-xs font-semibold text-slate-500 mt-0.5 flex items-center gap-1.5">
                  <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
                  <span>${rangeLabel}</span>
                  <span class="text-slate-300">·</span>
                  <span class="text-blue-600 font-bold">${weekAppointments.length} turnos agendados</span>
                </p>
              </div>
            </div>

            <!-- CONTROLES DE NAVEGACIÓN: SEMANA ANTERIOR, HOY, SEMANA SIGUIENTE -->
            <div class="flex items-center gap-1.5 self-start md:self-center shrink-0">
              <button 
                onclick="changeWeek(-1)"
                class="flex items-center gap-1 px-3 py-2 rounded-xl text-xs font-bold text-slate-700 bg-white hover:bg-slate-100 active:bg-slate-200 border border-slate-300 shadow-2xs transition-all cursor-pointer"
                title="Ver semana anterior"
              >
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Anterior</span>
              </button>

              <button 
                onclick="goToCurrentWeek()"
                class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all shadow-2xs cursor-pointer ${
                  isCurrentWeek 
                    ? 'bg-blue-600 text-white hover:bg-blue-500 active:bg-blue-700' 
                    : 'bg-white text-slate-800 hover:bg-slate-100 border border-slate-300'
                }"
                title="Volver a la semana actual"
              >
                Hoy
              </button>

              <button 
                onclick="changeWeek(1)"
                class="flex items-center gap-1 px-3 py-2 rounded-xl text-xs font-bold text-slate-700 bg-white hover:bg-slate-100 active:bg-slate-200 border border-slate-300 shadow-2xs transition-all cursor-pointer"
                title="Ver semana siguiente"
              >
                <span class="hidden sm:inline">Siguiente</span>
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <!-- GRILLA SEMANAL DE 7 COLUMNAS (LUNES A DOMINGO) -->
          <div class="overflow-x-auto">
            <div class="min-w-[840px] grid grid-cols-7 divide-x divide-slate-200/90 bg-slate-50/40">
              ${days.map(day => {
                // Obtener turnos de este día ordenados por hora de inicio
                const dayApps = state.appointments
                  .filter(a => a.date === day.dateStr)
                  .sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

                return `
                  <div class="flex flex-col min-h-[500px] bg-white/70 hover:bg-white transition-colors">
                    <!-- ENCABEZADO DE LA COLUMNA DEL DÍA -->
                    <div class="p-3 border-b border-slate-200 sticky top-0 z-10 transition-colors ${
                      day.isToday ? 'bg-blue-50/90 border-b-blue-200 shadow-2xs' : 'bg-slate-50/90'
                    }">
                      <div class="flex items-center justify-between gap-1">
                        <div>
                          <p class="text-[10px] font-extrabold uppercase tracking-wider ${day.isToday ? 'text-blue-700' : 'text-slate-500'}">
                            ${day.name}
                          </p>
                          <div class="flex items-center gap-1.5 mt-0.5">
                            <span class="text-base font-black ${day.isToday ? 'text-blue-900' : 'text-slate-900'}">
                              ${day.dayNumber}
                            </span>
                            ${day.isToday ? `
                              <span class="px-1.5 py-0.2 rounded-md bg-blue-600 text-white font-extrabold text-[9px] uppercase tracking-wider animate-pulse">
                                Hoy
                              </span>
                            ` : ''}
                          </div>
                        </div>

                        <!-- Botón Rápido + Turno para este día -->
                        <button 
                          onclick="openAppointmentModal(null, '${day.dateStr}')" 
                          class="p-1 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-100 transition-colors cursor-pointer"
                          title="Agendar turno para el ${day.name} ${day.dayNumber}"
                        >
                          <i data-lucide="plus-circle" class="w-4 h-4"></i>
                        </button>
                      </div>

                      <div class="mt-1 flex items-center justify-between text-[10px]">
                        <span class="text-slate-400 font-medium">Turnos:</span>
                        <span class="font-bold font-mono px-1.5 py-0.2 rounded ${
                          dayApps.length > 0 
                            ? (day.isToday ? 'bg-blue-600 text-white' : 'bg-slate-200 text-slate-700')
                            : 'bg-transparent text-slate-400'
                        }">
                          ${dayApps.length}
                        </span>
                      </div>
                    </div>

                    <!-- CUERPO DE LA COLUMNA: LISTADO DE CARDS DE TURNOS -->
                    <div class="p-2 space-y-2 flex-1 overflow-y-auto max-h-[580px]">
                      ${dayApps.length === 0 ? `
                        <div 
                          onclick="openAppointmentModal(null, '${day.dateStr}')" 
                          class="h-28 rounded-xl border-2 border-dashed border-slate-200 hover:border-blue-400 hover:bg-blue-50/30 flex flex-col items-center justify-center text-slate-400 hover:text-blue-600 text-[11px] font-semibold transition-all cursor-pointer p-2 text-center group"
                          title="Clic para agregar turno este día"
                        >
                          <i data-lucide="plus" class="w-4 h-4 text-slate-300 group-hover:text-blue-500 mb-1 transition-colors"></i>
                          <span>Sin turnos</span>
                          <span class="text-[9px] text-slate-400 group-hover:text-blue-500">+ Agendar</span>
                        </div>
                      ` : dayApps.map(app => {
                        const statusColors = {
                          confirmado: 'border-l-4 border-l-emerald-500 bg-emerald-50/50 hover:bg-emerald-50 text-emerald-900 border-emerald-200',
                          pendiente: 'border-l-4 border-l-amber-500 bg-amber-50/50 hover:bg-amber-50 text-amber-900 border-amber-200',
                          cancelado: 'border-l-4 border-l-rose-500 bg-rose-50/50 hover:bg-rose-50 text-rose-900 border-rose-200 opacity-75',
                          completado: 'border-l-4 border-l-blue-500 bg-blue-50/50 hover:bg-blue-50 text-blue-900 border-blue-200',
                          ausente: 'border-l-4 border-l-slate-400 bg-slate-100 hover:bg-slate-200/70 text-slate-800 border-slate-300'
                        };

                        const currentBadgeColor = {
                          confirmado: 'bg-emerald-100 text-emerald-800 border-emerald-300',
                          pendiente: 'bg-amber-100 text-amber-800 border-amber-300',
                          cancelado: 'bg-rose-100 text-rose-800 border-rose-300',
                          completado: 'bg-blue-100 text-blue-800 border-blue-300',
                          ausente: 'bg-slate-200 text-slate-800 border-slate-300'
                        }[app.status] || 'bg-slate-100 text-slate-700';

                        return `
                          <div 
                            onclick="openAppointmentModal('${app.id}')"
                            class="p-2.5 rounded-xl border border-slate-200/90 shadow-2xs hover:shadow-md transition-all cursor-pointer group relative bg-white ${statusColors[app.status] || 'border-l-4 border-l-blue-500'}"
                          >
                            <!-- Hora y Estado -->
                            <div class="flex items-center justify-between gap-1 mb-1">
                              <span class="text-[10px] font-mono font-bold text-slate-800 bg-white/90 px-1.5 py-0.5 rounded border border-slate-200 shadow-2xs">
                                ${app.startTime} - ${app.endTime}
                              </span>
                              <span class="text-[9px] font-extrabold uppercase px-1.5 py-0.2 rounded border ${currentBadgeColor}">
                                ${app.status}
                              </span>
                            </div>

                            <!-- Cliente -->
                            <h4 class="font-extrabold text-xs text-slate-900 truncate group-hover:text-blue-600 transition-colors">
                              ${app.clientName}
                            </h4>

                            <!-- Servicio -->
                            <p class="text-[11px] text-slate-600 font-medium truncate mt-0.5">
                              ${app.serviceName}
                            </p>

                            <!-- Footer Card: Precio y WhatsApp -->
                            <div class="mt-2 pt-1.5 border-t border-slate-100 flex items-center justify-between text-[10px]">
                              <span class="font-mono font-bold text-slate-700">
                                ${formatCurrencyARS(app.price)}
                              </span>

                              ${app.clientPhone ? `
                                <a 
                                  href="https://wa.me/${normalizeArgentinePhone(app.clientPhone)}?text=${encodeURIComponent(`Hola ${app.clientName}! Te contactamos de ${state.settings.businessName} por tu turno del ${app.date} a las ${app.startTime}hs.`)}"
                                  target="_blank"
                                  onclick="event.stopPropagation()"
                                  class="p-1 rounded-md text-emerald-700 bg-emerald-100/80 hover:bg-emerald-200 transition-colors"
                                  title="Enviar WhatsApp al cliente"
                                >
                                  <i data-lucide="message-square" class="w-3 h-3"></i>
                                </a>
                              ` : ''}
                            </div>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 11. VISTAS PRINCIPALES DEL PANEL
    // ==========================================
    function renderMainView() {
      const container = document.getElementById('mainContentArea');
      if (!container) return;

      switch (state.currentTab) {
        case 'dashboard':
          container.innerHTML = renderDashboardView();
          break;
        case 'calendar':
          container.innerHTML = renderCalendarView();
          break;
        case 'appointments':
          container.innerHTML = renderAppointmentsView();
          break;
        case 'clients':
          container.innerHTML = renderClientsView();
          break;
        case 'services':
          container.innerHTML = renderServicesCatalogView();
          break;
        case 'settings':
          container.innerHTML = renderSettingsView();
          break;
        default:
          container.innerHTML = renderDashboardView();
      }

      if (window.lucide) {
        window.lucide.createIcons();
      }
    }

    // 11.1 DASHBOARD: KPIS + CALENDARIO SEMANAL VISUAL + LISTA DEL DÍA
    function renderDashboardView() {
      const today = getTodayString();
      const todayApps = state.appointments.filter(a => a.date === today);
      const pendingApps = todayApps.filter(a => a.status === 'pendiente');
      
      let totalBilledMonth = 0;
      let totalCollectedMonth = 0;
      const currentMonthPrefix = today.slice(0, 7);

      state.appointments.forEach(a => {
        if (a.date && a.date.startsWith(currentMonthPrefix) && a.status !== 'cancelado') {
          totalBilledMonth += a.price || 0;
          totalCollectedMonth += a.amountPaid || 0;
        }
      });

      return `
        <div class="space-y-6">
          <!-- 1. Tarjetas KPI / Métricas Globales -->
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <div class="flex items-center justify-between text-slate-500 mb-2">
                <span class="text-xs font-bold uppercase tracking-wider">Turnos Hoy</span>
                <i data-lucide="calendar" class="w-4 h-4 text-blue-600"></i>
              </div>
              <p class="text-2xl font-black text-slate-900">${todayApps.length}</p>
              <p class="text-xs text-slate-500 mt-1">${pendingApps.length} pendientes de confirmar</p>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <div class="flex items-center justify-between text-slate-500 mb-2">
                <span class="text-xs font-bold uppercase tracking-wider">Cobrado Mes</span>
                <i data-lucide="dollar-sign" class="w-4 h-4 text-emerald-600"></i>
              </div>
              <p class="text-2xl font-black text-emerald-700 font-mono">${formatCurrencyARS(totalCollectedMonth)}</p>
              <p class="text-xs text-slate-500 mt-1">Facturación total: ${formatCurrencyARS(totalBilledMonth)}</p>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <div class="flex items-center justify-between text-slate-500 mb-2">
                <span class="text-xs font-bold uppercase tracking-wider">Clientes Registrados</span>
                <i data-lucide="users" class="w-4 h-4 text-indigo-600"></i>
              </div>
              <p class="text-2xl font-black text-slate-900">${state.clients.length}</p>
              <p class="text-xs text-slate-500 mt-1">Directorio sincronizado</p>
            </div>

            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs">
              <div class="flex items-center justify-between text-slate-500 mb-2">
                <span class="text-xs font-bold uppercase tracking-wider">Servicios Activos</span>
                <i data-lucide="briefcase" class="w-4 h-4 text-amber-600"></i>
              </div>
              <p class="text-2xl font-black text-slate-900">${state.services.length}</p>
              <p class="text-xs text-slate-500 mt-1">Tabla 'servicios' de Supabase</p>
            </div>
          </div>

          <!-- 2. COMPONENTE PRINCIPAL: CALENDARIO SEMANAL VISUAL INTERACTIVO -->
          ${renderWeeklyCalendarGrid('Agenda Semanal del Estudio')}

          <!-- 3. Listado Rápido de Turnos del Día de Hoy -->
          <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
              <div>
                <h3 class="font-bold text-base text-slate-900">Turnos Programados para Hoy (${today})</h3>
                <p class="text-xs text-slate-500">Acceso rápido con estados y contacto directo por WhatsApp</p>
              </div>
              <button onclick="openAppointmentModal(null, '${today}')" class="px-3.5 py-1.5 bg-blue-50 text-blue-700 hover:bg-blue-100 rounded-xl text-xs font-bold transition-colors cursor-pointer">
                + Agregar turno hoy

    // 11.3 LISTA DE TURNOS (TABLA COMPLETA CON FILTROS Y ACCIONES)
    function renderAppointmentsView() {
      let filtered = [...state.appointments];
      const today = getTodayString();

      if (state.statusFilter === 'today') {
        filtered = filtered.filter(a => a.date === today);
      } else if (state.statusFilter !== 'all') {
        filtered = filtered.filter(a => a.status === state.statusFilter);
      }

      if (state.searchQuery.trim()) {
        const q = state.searchQuery.toLowerCase();
        filtered = filtered.filter(a => 
          a.clientName.toLowerCase().includes(q) ||
          a.clientPhone.includes(q) ||
          a.serviceName.toLowerCase().includes(q)
        );
      }

      return `
        <div class="space-y-4">
          <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="relative w-full sm:w-80">
              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input 
                type="text" 
                placeholder="Buscar por cliente, teléfono o servicio..." 
                value="${state.searchQuery}"
                oninput="handleSearch(this.value)"
                class="w-full bg-slate-50 border border-slate-300 rounded-xl pl-9 pr-3 py-1.5 text-xs text-slate-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <div class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto">
              ${['all', 'today', 'pendiente', 'confirmado', 'cancelado'].map(st => `
                <button 
                  onclick="applyFilter('${st}')"
                  class="px-3 py-1.5 rounded-lg text-xs font-bold capitalize transition-colors whitespace-nowrap cursor-pointer ${
                    state.statusFilter === st 
                      ? 'bg-blue-600 text-white' 
                      : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }"
                >
                  ${st === 'all' ? 'Todos' : st === 'today' ? 'Hoy' : st}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-600 font-bold uppercase text-[10px]">
                  <tr>
                    <th class="py-3 px-4">Fecha y Hora</th>
                    <th class="py-3 px-4">Cliente</th>
                    <th class="py-3 px-4">Servicio</th>
                    <th class="py-3 px-4">Precio / Cobrado</th>
                    <th class="py-3 px-4">Estado (Editar)</th>
                    <th class="py-3 px-4 text-right">Acciones</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium text-slate-800">
                  ${filtered.length === 0 ? `
                    <tr><td colspan="6" class="p-8 text-center text-slate-400">No se encontraron turnos con los filtros actuales.</td></tr>
                  ` : filtered.map(app => `
                    <tr class="hover:bg-slate-50/70 transition-colors">
                      <td class="py-3 px-4 whitespace-nowrap">
                        <span class="font-bold text-slate-900">${app.date}</span>
                        <span class="text-slate-500 block font-mono text-[11px]">${app.startTime} - ${app.endTime} hs</span>
                      </td>
                      <td class="py-3 px-4">
                        <span class="font-bold text-slate-900">${app.clientName}</span>
                        <span class="text-slate-500 block font-mono text-[11px]">${app.clientPhone || 'Sin teléfono'}</span>
                      </td>
                      <td class="py-3 px-4">
                        <span class="font-semibold text-slate-800">${app.serviceName}</span>
                        <span class="text-slate-400 block text-[10px]">${app.durationMinutes} min</span>
                      </td>
                      <td class="py-3 px-4 font-mono whitespace-nowrap">
                        <span class="font-bold text-slate-900">${formatCurrencyARS(app.price)}</span>
                        <span class="text-emerald-700 block text-[10px]">Cobrado: ${formatCurrencyARS(app.amountPaid)}</span>
                      </td>
                      <td class="py-3 px-4 whitespace-nowrap">
                        <select 
                          onchange="changeAppointmentStatus('${app.id}', this.value)"
                          class="text-[11px] font-bold px-2 py-1 rounded-lg border cursor-pointer ${
                            app.status === 'confirmado' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' :
                            app.status === 'pendiente' ? 'bg-amber-50 text-amber-800 border-amber-300' :
                            app.status === 'cancelado' ? 'bg-rose-50 text-rose-800 border-rose-300' :
                            'bg-slate-100 text-slate-700 border-slate-300'
                          }"
                        >
                          <option value="pendiente" ${app.status === 'pendiente' ? 'selected' : ''}>Pendiente</option>
                          <option value="confirmado" ${app.status === 'confirmado' ? 'selected' : ''}>Confirmado</option>
                          <option value="completado" ${app.status === 'completado' ? 'selected' : ''}>Completado</option>
                          <option value="cancelado" ${app.status === 'cancelado' ? 'selected' : ''}>Cancelado</option>
                          <option value="ausente" ${app.status === 'ausente' ? 'selected' : ''}>Ausente</option>
                        </select>
                      </td>
                      <td class="py-3 px-4 text-right whitespace-nowrap">
                        <div class="flex items-center justify-end gap-1">
                          ${app.clientPhone ? `
                            <a 
                              href="https://wa.me/${normalizeArgentinePhone(app.clientPhone)}?text=${encodeURIComponent(`Hola ${app.clientName}! Te contactamos de ${state.settings.businessName} por tu turno del ${app.date} a las ${app.startTime}hs.`)}"
                              target="_blank" 
                              class="p-1.5 text-emerald-700 bg-emerald-50 hover:bg-emerald-100 rounded-lg border border-emerald-200"
                              title="Enviar WhatsApp"
                            >
                              <i data-lucide="send" class="w-3.5 h-3.5"></i>
                            </a>
                          ` : ''}
                          <button onclick="openAppointmentModal('${app.id}')" class="p-1.5 text-slate-600 hover:text-blue-600 hover:bg-blue-50 rounded-lg cursor-pointer" title="Editar turno completo">
                            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
                          </button>
                          <button onclick="deleteAppointment('${app.id}', ${app.numericId})" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg cursor-pointer" title="Eliminar de Supabase">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

        clientEmail: '',
        serviceName: state.services[0]?.name || 'Consulta Estándar',
        serviceId: state.services[0]?.id || 'srv-1',
        date: getTodayString(),
        startTime: '10:00',

        document.getElementById('modalDuration').value = s.durationMinutes;
        document.getElementById('modalPrice').value = s.price;
      }
    }

      const match = state.services.find(s => s.name.toLowerCase() === val.trim().toLowerCase());

    function handleAppointmentFormSubmit(e) {
      e.preventDefault();
      const clientName = document.getElementById('modalClientName').value.trim();
      const clientPhone = document.getElementById('modalClientPhone').value.trim();
      const serviceName = document.getElementById('modalServiceNameInput').value.trim();
      const date = document.getElementById('modalDate').value;
      const startTime = document.getElementById('modalStartTime').value;
      const durationMinutes = Number(document.getElementById('modalDuration').value) || 30;
      const price = Number(document.getElementById('modalPrice').value) || 0;
      const amountPaid = Number(document.getElementById('modalPaid').value) || 0;
      const status = document.getElementById('modalStatus').value;
      const notes = document.getElementById('modalNotes').value.trim();
      const endTime = addMinutesToTime(startTime, durationMinutes);

      const payload = {
        id: state.editingAppointment ? state.editingAppointment.id : `app-${Date.now()}`,
        numericId: state.editingAppointment ? state.editingAppointment.numericId : null,
        clientId: state.editingAppointment ? state.editingAppointment.clientId : `cli-${Date.now()}`,
        clientName,
        clientPhone,
        serviceName,
        date,
        startTime,
        endTime,
        durationMinutes,
        price,
        amountPaid,
        status,
        notes
      };

      saveAppointment(payload);
    }
